<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Examen clasa C - 494 intrebari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#F4F6F7;
  --shoal:#FFFFFF;
  --shoal-2:#E9EDEF;
  --chart:#16202A;
  --chart-dim:#5A6B73;
  --port:#B4271F;
  --starboard:#1E7A44;
  --sector:#966508;
  --line:rgba(22,32,42,.14);
  --r:0.167rem;
  --sp:22px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--sea); color:var(--chart);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:24px; line-height:1.5; font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--sector);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:760px;margin:0 auto;padding:calc(var(--sp)*1.5) var(--sp) 2.667rem}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:0.5rem;
     padding-bottom:0.583rem;border-bottom:1px solid var(--line);margin-bottom:0.917rem}
.top h1{margin:0;font-size:1.0625rem;font-weight:600;letter-spacing:.01em}
.top .sub{color:var(--chart-dim);font-size:.8125rem}

.overall{display:flex;gap:0.125rem;margin-bottom:0.333rem}
.overall i{flex:1;height:0.208rem;border-radius:0.042rem;background:var(--shoal-2)}
.overall i.g{background:var(--starboard)} .overall i.y{background:var(--sector)}
.overall i.r{background:var(--port)}
.overall-note{color:var(--chart-dim);font-size:.8125rem;margin:0 0 1.083rem}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.5rem,1fr));gap:0.417rem}
.tile{position:relative;background:var(--shoal);border:1px solid var(--line);
      border-radius:var(--r);padding:0.5rem 0.5rem 0.417rem;text-align:left;
      display:flex;flex-direction:column;gap:0.083rem;min-height:5.5rem;
      box-shadow:0 1px 2px rgba(22,32,42,.08);
      transition:background .12s ease,border-color .12s ease,box-shadow .12s ease}
.tile:hover{background:var(--shoal-2)}
.tile .no{font-size:.75rem;color:var(--chart-dim)}
.tile .sc{font-size:1.5rem;font-weight:600;line-height:1.1;margin-top:auto}
.tile .st{font-size:.75rem;color:var(--chart-dim)}
.tile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0.125rem;
             border-radius:0 0 var(--r) var(--r);background:transparent}
.tile.r::after{background:var(--port)} .tile.y::after{background:var(--sector)}
.tile.g::after{background:var(--starboard)}
.tile.g .sc{color:var(--starboard)} .tile.y .sc{color:var(--sector)}
.tile.r .sc{color:var(--port)}

.acts{display:flex;flex-wrap:wrap;gap:0.333rem;margin:1.083rem 0 0}
.btn{background:var(--shoal);border:1px solid var(--line);border-radius:var(--r);
     padding:0.667rem 0.667rem;font-size:.9375rem;font-weight:500}
.btn:hover{background:var(--shoal-2)}
.btn.primary{background:var(--starboard);border-color:var(--starboard);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none}

.qhead{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.583rem}
.qhead .back{color:var(--chart-dim);font-size:.875rem}
.qhead .pos{margin-left:auto;color:var(--chart-dim);font-size:.875rem}
.ticks{display:flex;gap:0.125rem;margin-bottom:0.917rem}
.ticks i{flex:1;height:0.167rem;border-radius:0.042rem;background:var(--shoal-2);cursor:pointer}
.ticks i.done{background:var(--chart-dim)}
.ticks i.cur{background:var(--chart)}
.sect{color:var(--chart-dim);font-size:.8125rem;margin:0 0 0.25rem}
.qtext{font-size:1.1875rem;font-weight:500;line-height:1.4;margin:0 0 0.917rem}
.opts{display:flex;flex-direction:column;gap:0.333rem}
.opt{display:flex;gap:0.5rem;align-items:flex-start;text-align:left;
     background:var(--shoal);border:1px solid var(--line);border-radius:var(--r);
     padding:0.667rem 0.667rem;line-height:1.45;transition:background .12s,border-color .12s}
.opt:hover{background:var(--shoal-2)}
.opt .k{flex:0 0 auto;font-weight:600;color:var(--chart-dim);min-width:1.2em}
.opt.sel{border-color:var(--chart);background:var(--shoal-2)}
.opt.sel .k{color:var(--chart)}
.nav{display:flex;gap:0.333rem;margin-top:0.917rem}
.nav .btn{flex:1}

.score{text-align:center;padding:1.417rem 0 0.333rem}
.score .big{font-size:4rem;font-weight:600;line-height:1}
.score .of{color:var(--chart-dim);font-size:.9375rem;margin-top:0.167rem}
.score.g .big{color:var(--starboard)} .score.y .big{color:var(--sector)}
.score.r .big{color:var(--port)}
.verdict{text-align:center;font-size:1rem;margin:0.417rem 0 1.083rem}
.rev{margin-top:1.25rem}
.rev h2{font-size:.9375rem;font-weight:600;margin:0 0 0.5rem;padding-bottom:0.333rem;
        border-bottom:1px solid var(--line)}
.item{border-left:0.125rem solid var(--port);padding:0.083rem 0 0.083rem 0.583rem;margin-bottom:0.917rem}
.item.ok{border-left-color:var(--starboard)}
.item .q{font-weight:500;margin:0 0 0.333rem}
.item .line{font-size:.9375rem;margin:0 0 0.167rem}
.item .bad{color:var(--port)} .item .good{color:var(--starboard)}
.item .lab{color:var(--chart-dim)}
.empty{color:var(--chart-dim);text-align:center;padding:1.667rem 0}
.hist{color:var(--chart-dim);font-size:.8125rem;margin-top:0.25rem}
</style>
</head>

<script>
const QUESTIONS =[{"n":1,"s":"nav","q":"Caror nave li se aplica prevederile Colreg-1972?","a":["tuturor navelor care naviga in apele internationale.","tuturor navelor care naviga in rade, stramtori si marea libera.","tuturor navelor aflate in largul marii ori pe toate apele invecinate accesibile navelor maritime."],"c":2},{"n":2,"s":"nav","q":"Tuturor navelor aflate in largul marii ori pe toate apele invecinate accesibile navelor maritime li se aplica prevederile:","a":["COLREG-1972.","R.N.D.","Codului ISPS."],"c":0},{"n":3,"s":"nav","q":"Dispozitiile Regulamentului impiedica aplicarea prescriptiilor speciale stabilite de catre autoritatea competenta referitoare la navigatia in rade, porturi, pe fluvii, lacuri sau cai de navigatie interioara accesibile navelor maritime?","a":["da.","nu.","nu este precizat."],"c":1},{"n":4,"s":"nav","q":"Cum influenteaza prevederile Regulamentului prescriptiile speciale referitoare la navigatia in rade, porturi, pe fluvii, lacuri sau cai de navigatie interioara accesibile navelor maritime?","a":["dispozitiile regulamentului nu trebuie sa impiedice aplicarea prescriptiilor speciale stabilite de catre autoritatea competenta, dar asemenea prescriptii speciale trebuie sa fie cat mai conforme cu prezentele reguli.","autoritatea competenta nu este obligata sa tina seama de prescriptiile Regulamentului.","in toate situatiile se vor aplica prevederile Regulamentului."],"c":0},{"n":5,"s":"nav","q":"Guvernul unui stat poate stabili prescriptiile speciale cu privire la numarul luminilor de pozitie, a semnalelor luminoase, prescriptii care sa fie astfel incat sa faca imposibila confundarea lor cu Regulamentul?","a":["nu.","nu este precizat.","da."],"c":2},{"n":6,"s":"nav","q":"Dispozitiile Regulamentului scutesc nava, comandantul sau armatorul de consecintele unei neglijente oarecare in ceea ce priveste aplicarea Regulamentului sau in ceea ce priveste luarea tuturor masurilor cerute de o buna practica marinareasca?","a":["nu este precizat.","da.","nu."],"c":2},{"n":7,"s":"nav","q":"Cand este exonerata o nava, comanantul sau armatorul de consecintele unei neglijente sau de neluarea tuturor masurilor cerute de o buna practica marinareasca?","a":["aplicarea regulilor scuteste nava, comandantul sau armatorul de orice raspundere.","conformarea intocmai la prevederile regulii \"nava privilegiata\" scuteste nava, comandantul sau armatorul de orice raspundere.","dispozitiile Regulamentului nu scutesc nava, comandantul sau armatorul de consecintele unei neglijente oarecare in ceea ce priveste aplicarea Regulamentului sau in ceea ce priveste luarea tuturor masurilor cerute de o buna practica marinareasca."],"c":2},{"n":8,"s":"nav","q":"Cand exista riscul unei coliziuni, precum si in toate imprejurarile deosebite sunt permise:","a":["abaterea de la prevederile Regulamentului.","abateri de la prevederile autoritatilor portuare.","abateri de la prevederile legilor specifice."],"c":0},{"n":9,"s":"nav","q":"Cand sunt permise abateri de la prevederile Regulamentului?","a":["in apele nationale, rade si in toate apele invecinate accesibile navelor maritime.","cand exista pericol de navigatie, riscul unei coliziuni, precum si in toate imprejurarile deosebite.","indiferent de situatie, nu este permisa abaterea de la prevederile Regulamentului."],"c":1},{"n":10,"s":"nav","q":"Ce se intelege prin expresia\"nava\", conform Regulamentului?","a":["orice constructie sau aparat, de orice natura, capabil sa pluteasca pe apa fara propulsie.","orice constructie sau orice aparat, de orice natura ar fi, inclusiv constructiile fara pescaj si hidro avioane, folosite sau susceptibile de a fi folosite ca mijloc de transport pe apa.","orice corp plutitor cu orice mijloc de propulsie."],"c":1},{"n":11,"s":"nav","q":"Ce se intelege prin \"nava cu propulsie mecanica\"?","a":["orice nava pusa in miscare de catre o masina.","navele care folosesc ca mijloc de propulsie un motor Diesel.","toate navele care se pot deplasa pe apa, cu exceptia navelor cu vele."],"c":0},{"n":12,"s":"nav","q":"O nava care naviga cu vele, chiar daca are o masina proprie, cu conditia ca aceasta sa nu fie folosita, reprezinta:","a":["o nava cu vele.","o nava cu propulsie mecanica, care foloseste si velele.","o nava care foloseste ca mijloc de propulsie forta vantului."],"c":0},{"n":13,"s":"nav","q":"Ce se intelege prin expresia \"nava cu vele\"?","a":["o nava care foloseste ca mijloc de propulsie forta vantului.","o nava cu propulsie mecanica, care foloseste si vele.","o nava care naviga cu vele, chiar daca are o masina proprie, cu conditia ca aceasta sa nu fie folosita."],"c":2},{"n":14,"s":"nav","q":"O nava care din cauza unei imprejurari exceptionale nu este in masura sa manevreze si deci, nu poate sa se indeparteze din drumul altei nave trebuie considerata:","a":["nava nu este stapana pe manevra sa.","nava cu capacitate de manevra redusa.","nava stanjenita de pescajul sau."],"c":0},{"n":15,"s":"nav","q":"Ce se intelege prin expresia \"nava cu capacitate de manevra redusa\"?","a":["o nava a carei capacitate de manevra conform Regulamentului este limitata prin natura lucrarilor sale si care, in consecinta, nu se poate indeparta din drumul altei nave.","o nava cu avarii accidentale la carma si/sau masina, in curs de remediere.","o nava care nu se poate abate din drumul sau, datorita unor pericole de navigatie."],"c":0},{"n":16,"s":"nav","q":"O nava cu propulsie mecanica, care din cauza pescajului si a adancimii apei sub chila poate sa-si modifice cu greu drumul, se considera :","a":["nava stanjenita de pescajul sau.","nava cu lungime mai mare de 200 m","nava cu capacitate de manevra redusa."],"c":0},{"n":17,"s":"nav","q":"O nava care nu este nici la ancora, nici legata la cheu, nici esuata se considera:","a":["nava \"in mars\".","nava in deriva.","nava care tine la capa."],"c":0},{"n":18,"s":"nav","q":"Cand una dintre nave poate fi observata vizual de catre cealalta nava, se considera:","a":["nava in siguranta.","nave aflate in vedere.","nave in mars."],"c":1},{"n":19,"s":"nav","q":"Cand doua nave se considera in vedere?","a":["cand se observa vizual reciproc.","numai cand una dintre ele poate fi observata vizual de catre cealalta.","cand navele se afla in limita de observare cu radarul."],"c":1},{"n":20,"s":"nav","q":"Cum trebuie sa se asigure veghea la bordul navei?","a":["trebuie sa se asigure in permanenta o veghe vizuala si auditiva corespunzatoare, folosind in acelasi timp toate mijloacele disponibile, potrivit cu imprejurarile si conditiile existente, in asa fel incat sa permita o apreciere completa a situatiei.","trebuie sa se asigure in permanenta o veghe vizuala pentru evitarea unei situatii periculoase.","in conditii de vizibilitate redusa, se va organiza o veghe corespunzatoare, pentru a aprecia existenta unui pericol de coliziune."],"c":0},{"n":21,"s":"nav","q":"Pentru a se putea actiona corect si eficace pentru prevenirea unei coliziuni si pentru ca nava sa poata fi oprita pe o distanta corespunzatoare imprejurarilor si conditiilor, se impune mentiunea de a naviga cu:","a":["viteza maxima.","viteza minima.","viteza de siguranta."],"c":2},{"n":22,"s":"nav","q":"Care sunt factorii care trebuie luati in consideratie pentru determinarea \"vitezei de siguranta\"?","a":["lungimea navei, calitatile nautice ale navei, puterea masinii si vizibilitatea.","pregatirea echipajului, conditiile de navigatie, vizibilitatea.","vizibilitatea, densitatea traficului, capacitatea de manevra a navei, noaptea-existenta unui fundal luminos, starea vantului si a marii, pescajul navei."],"c":2},{"n":23,"s":"nav","q":"Orice nava trebuie sa foloseasca toate mijloacele disponibile corespunzatoare imprejurarilor si conditiilor externe pentru a stabili daca exista:","a":["un pericol de esuare.","un pericol iminent.","un pericol de coliziune."],"c":2},{"n":24,"s":"nav","q":"Ce mijloace trebuie sa foloseasca o nava pentru a stabili daca exista pericolul de coliziune?","a":["orice nava trebuie sa foloseasca toate mijloacele disponibile corespunzatoare imprejurarilor si conditiilor extrene, pentru a stabili daca exista un pericol de coliziune.","orice nava trebuie sa foloseasca toate mijloacele vizuale, pentru a stabili daca exista pericolul de coliziune.","orice nava trebuie sa foloseasca radarul, pentru a stabili daca exista pericolul de coliziune."],"c":0},{"n":25,"s":"nav","q":"Cand relevmentul compas la o nava care se apropie nu variaza in mod apreciabil, se considera :","a":["nave in vedere.","pericol de coliziune.","nave cu drumuri opuse."],"c":1},{"n":26,"s":"nav","q":"Cand se considera ca exista pericol de coliziune?","a":["cand navele naviga in drumuri opuse.","cand relevmentul compas la o nava care se apropie nu variaza in mod apreciabil.","cand viteza de apropiere intre cele doua nave este foarte mare."],"c":1},{"n":27,"s":"nav","q":"Cum trebuie sa se execute o manevra pentru evitarea unei coliziuni?","a":["din timp, cu schimbari mici de drum, pentru a nu devia prea mult de la drumul navei.","hotarat, din timp si conform cu buna practica marinareasca.","hotarat, cu variatii de viteza, pentru evitarea pericolului."],"c":1},{"n":28,"s":"nav","q":"Cum trebuie sa se execute schimbarile de drum si/sau de viteza pentru evitarea ueni coliziuni?","a":["schimbari mici de drum si/sau de viteza, pentru a nu devia prea mult de la drumul navei.","schimbari destul de mari de viteza si mici de drum, pentru a nu devia prea mult de la drumul navei.","daca imprejurarile permit, sa fie destul de mare, pentru a putea fi perceputa imediat de orice nava care o observa vizual sau cu radarul."],"c":2},{"n":29,"s":"nav","q":"Daca pentru evitarea unei coliziuni este suficienta numai schimbarea de drum, cum trebuie sa fie executata?","a":["manevra se va face cu mult timp inainte, sa fie substantiala si sa nu conduca la o alta situatie de foarte mare apropiere.","se vor executa schimbari mari de drum, suficiente pentru evitarea coliziunii.","se va efectua o schimbare de drum suficienta pentru ca sa se elimine orice pericol de coliziune."],"c":0},{"n":30,"s":"nav","q":"Manevra de evitare intre nave se va efectua astfel incat sa permita trecerea la:","a":["o distanta maxima.","o distanta de siguranta.","o distanta minima."],"c":1},{"n":31,"s":"nav","q":"Pana cand se controleaza eficacitatea unei manevre de evitare?","a":["pana cand navele vor fi la travers una fata de cealalta.","pana cand nava cealalta va fi intr-un unghi de 45 tribord/babord.","pana cand nava cealalta a fost complet si definitiv depasita."],"c":2},{"n":32,"s":"nav","q":"Care este manevra cea mai indicata pentru a se castiga mai mult timp pentru aprecierea situatiei, atunci cand trebuie sa se evite o coliziune?","a":["reducerea vitezei sau opirea completa, stopand masinile ori punandu-le inapoi.","stoparea navei.","reducerea la minimum de viteza, pana la limita guvernarii."],"c":0},{"n":33,"s":"nav","q":"Cum se naviga in senal sau cale navigabila ingusta?","a":["pe mijlocul senalului sau caii de acces.","cat mai aproape posibil de marginea exterioara din dreapta senalului sau caii de acces respective, atunci cand aceasta se poate face.","se va naviga intotdeauna cat mai aproape posibil de marginea exterioara a senalului sau caii de acces, pentru asigurarea unei veghe corespunzatoare."],"c":1},{"n":34,"s":"nav","q":"Ce semnale pot da navele care naviga prin senal si se indoiesc de intentiile navei care traverseaza senalul?","a":["un sunet lung si doua scurte.","un semnal de avertizare compus din cinci sunete scurte.","un semnal lung de atentionare."],"c":1},{"n":35,"s":"nav","q":"Ce masuri de siguranta trebuie sa ia o nava care se apropie de un cot aflat intr-un senal sau o cale de acces ingusta?","a":["sa emita cinci sunete scurte (de avertizare)","sa emita un semnal scurt si sa navige pe partea dreapta a senalului.","sa emita un semnal lung si sa navige cu prudenta si vigilenta."],"c":2},{"n":36,"s":"nav","q":"Schemelor de separare a traficului li se aplica reglementarile referitoare la schemele de separare a traficului, adoptate de:","a":["guvernele tarilor unde se afla schemele.","Organizatie.","Organizatie si guvernele anumitor tari."],"c":1},{"n":37,"s":"nav","q":"Nava trebuie sa navige pe banda de navigatie corespunzatoare in directia generala a traficului si sa se indeparteze,in masura posibilului, de linia sau zona de separare a sensurilor de trafic atunci cand trebuie sa navige:","a":["in exteriorul unei scheme de separare a traficului.","in interiorul unei scheme de separare a traficului.","in interiorul unei benzi de separatie."],"c":1},{"n":38,"s":"nav","q":"Cum trebuie sa se angajeze o nava pentru intrarea sau iesirea dintr-o schema de separare a traficului?","a":["sub un unghi drept fata de directia generala a traficului.","ca regula generala pe la una din extremitati,dar atunci cand se angajeaza sa intre sau sa iasa,din orice parte,sa faca manevra sub unghi cat mai mic fata de directia traficului.","prin zona de separare a traficului,dar cu aprobarea autoritatilor care supravegheaza navigatia in schema de separare a traficului."],"c":1},{"n":39,"s":"nav","q":"Cum trebuie sa intretaie o nava benzile de separatie, cand este obligata sa o faca?","a":["sub un unghi cat mai mic fata de directia generala a traficului si cu viteza redusa.","sub un unghi cat mai mic fata de directia generala a traficului si cu viteza maxima.","pe cat posibil perpendicular fata de directia generala a traficului."],"c":2},{"n":40,"s":"nav","q":"Zonele de navigatie costiera pot fi folosite pentru traficul costier?","a":["in mod normal nu trebuie folosite pentru traficul direct, cu exceptia navelor mai mici de 20 m lungime si a navelor cu vele.","pot fi folosite de toate navele apartinand tarii riverane.","pot fi folosite de navele cu capacitate de manevra redusa."],"c":0},{"n":41,"s":"nav","q":"Cand poate o nava sa patrunda intr-o zona de separare sau sa taie o linie de separare?","a":["cand conditiile hidrometeorologice fac dificila navigatia in sensul general al traficului.","in caz de urgenta, pentru evitarea unui pericol imediat, sau pentru a pescui intr-o zona de separare.","zona de separare nu va fi traversata in nici o situatie."],"c":1},{"n":42,"s":"nav","q":"Cum trebuie sa se navige in zone vecine cu extremitatile unei zone de separare a traficului?","a":["se va naviga in directia generala a traficului.","se vor semnaliza sonor si vizual intentiile de schimbare de drum.","cu atentie deosebita."],"c":2},{"n":43,"s":"nav","q":"Este permisa ancorarea in schemele de separare a traficului?","a":["se va evita in masura maxima a posibilului ancorarea atat in schema de separare, cat si in zonele invecinate acesteia.","se poate ancora, dar se vor da toate semnalele prevazute in prezentele reguli.","nu se poate ancora in nici o situatie."],"c":0},{"n":44,"s":"nav","q":"Cum trebuie sa navige navele care nu folosesc o schema de separare a traficului?","a":["sa foloseasca zonele de navigatie costiera.","sa se indeparteze cat mai mult de zona de separare a traficului.","sa navige in apropiere, dar sa nu intersecteze linia de separare."],"c":1},{"n":45,"s":"nav","q":"Care sunt navele exceptate de la prevederile regulii referitoare la navigatie in schemele de separare a traficului?","a":["navele cu capacitate de manevra redusa, angajate in manevra de mentinere a sigurantei navigatiei.","navele cu defectiuni la motorul principal.","navele cu avarii la carma."],"c":0},{"n":46,"s":"nav","q":"Ce nava trebuie sa se abata din drumul navei ajunsa din urma?","a":["nava care se afla la o distanta de 200 m.","nava care se afla la o distanta de 100 m.","nava care ajunge din urma."],"c":2},{"n":47,"s":"nav","q":"Cum se comporta o nava care ajunge din urma (depaseste) o alta nava?","a":["nava care ajunge din urma o alta nava va avea prioritate.","nava ajunsa din urma va manevra astfel incat sa-i permita navei care o depaseste deplasarea.","orice nava care ajunge din urma o alta nava trebuie sa se abata din drumul navei ajunsa din urma."],"c":2},{"n":48,"s":"nav","q":"Cand se considera ca o nava ajunge din urma alta nava?","a":["cand vine dintr-o directie mai mare de 22.5 dinapoia traversului celeilalte nave, astfel incat noaptea se vede numai lumina din pupa si luminile din bordurile navei ajunsa din urma.","cand vede lumina din pupa si luminile din bordurile navei ajunsa din urma.","cand vede lumina catargului pupa si luminile din pupa."],"c":0},{"n":49,"s":"nav","q":"Cum trebuie sa manevreze o nava care nu poate stabili cu siguranta ca ajunge din urma alta nava?","a":["sa se considere nava privilegiata si sa-si mentina viteza si drumul.","sa se considere nava care ajunge din urma si sa manevreze in consecinta.","sa dea semnalele corespunzatoare si dupa edificare sa procedeze conform situatiei."],"c":1},{"n":50,"s":"nav","q":"Cum trebuie sa manevreze doua nave cu vele care se apropie una de alta, astfel incat exista pericolul de coliziune si primesc vantul din borduri diferite?","a":["nava care primeste vantul din babord trebuie sa se abata din drumul navei care primeste vantul din tribord.","nava care primeste vantul din tribord trebuie sa se abata din drumul navei care primeste vantul din babord.","nava care primeste vantul din pupa trebuie sa se abata din drumul navei care primeste vantul din tribord."],"c":0},{"n":51,"s":"nav","q":"Cum trebuie sa manevreze doua nave cu vele care se apropie una de alta, astfel incat exista pericolul de coliziune si primesc vantul din acelasi bord?","a":["nava care o vede pe cealalta prin babord trebuie sa se abata din drumul celeilalte nave.","nava care este in vant se va abate din drumul navei de sub vant.","nava care o vede pe cealalta prin tribord trebuie sa se abata din drumul celeilalte nave."],"c":1},{"n":52,"s":"nav","q":"Care este manevra unei nave care nu este obligata sa se abata din drumul altei nave?","a":["trebuie sa-si mentina drumul si viteza.","va schimba numai drumul, pentru a evita o situatie periculoasa.","va reduce viteza sau va stopa, pentru a nu crea situatii periculoase."],"c":0},{"n":53,"s":"nav","q":"Cand trebuie sa manevreze nava care nu este obligata sa se abata din drumul altei nave?","a":["indiferent de situatie, nu se va abate niciodata din drumul altei nave.","imediat ce i se pare evident faptul ca nava care are obligatia de a se abate din drumul sau nu face manevra.","cand in urma observarii relevmentului si-a dat seama ca exista pericolul de coliziune."],"c":1},{"n":54,"s":"nav","q":"Din drumul caror nave trebuie sa se abata o nava cu propulsie mecanica in mars?","a":["navelor cu vele.","velierelor care naviga numai cu masina.","velierelor care poarta la prova un semn conic negru, cu varful in jos."],"c":0},{"n":55,"s":"nav","q":"Din drumul caror nave trebuie sa se abata o nava cu vele in mars?","a":["navelor cu propulsie mecanica cu viteza mica.","navelor care nu sunt stapane pe manevra lor.","navelor petroliere sau navelor care transporta gaze lichefiate."],"c":1},{"n":58,"s":"nav","q":"Din drumul caror nave trebuie sa se abata o nava stanjenita de pescajul sau?","a":["navelor cu vele.","navelor nestapane pe manevra lor.","navelor petrolier sau navelor care transporta gaze lichefiate."],"c":1},{"n":59,"s":"nav","q":"Caror nave li se aplica regulile de conducerea navelor pe vizibilitate redusa?","a":["navelor care naviga in interiorul zonelor de vizibiliate redusa si numai una dintre ele nu o vede pe cealalta.","navelor care nu se vad una pe alta si care naviga inlauntrul sau in apropierea zonelor de vizibilitate redusa.","navelor care naviga in interiorul sau in apropierea zonelor de vizibilitate redusa si observa una la alta numai luminile de catarg."],"c":1},{"n":60,"s":"nav","q":"Cu ce viteza trebuie sa navige o nava in conditii de vizibilitate redusa?","a":["cu viteza redusa si veghe la prova.","cu viteza economica, dar cu radarul in functiune si cu o veghe corespunzatoare, pentru a evita pericolul de coliziune.","cu o viteza de siguranta adaptata imprejurarilor existente si conditiilor de vizibilitate redusa."],"c":2},{"n":61,"s":"nav","q":"Cand se vor respecta regulile referitoare la \"lumini si semne\"?","a":["in mars ziua si noaptea.","pe orice vreme.","in stationare ziua si noaptea."],"c":1},{"n":62,"s":"nav","q":"In ce perioada sunt respectate regulile referitoare la lumini?","a":["pe timpul noptii.","pe timpul noptii si pe vizibilitate redusa.","de la apusul la rasaritul soarelui."],"c":2},{"n":63,"s":"nav","q":"Pe timpul zilei se vor respecta regulile cu privire la:","a":["lumini.","semne.","lumini si semne."],"c":1},{"n":64,"s":"nav","q":"Cand mai pot fi purtate luminile prevazute de reguli?","a":["de la rasaritul la apusul soarelui, pe timp cu vizibilitate redusa, in toate imprejurarile in care aceasta masura este necesara.","cand vizibilitatea este sub 3 Mm.","in sramtori, cand vizibiliatea este redusa."],"c":0},{"n":65,"s":"nav","q":"Cand se vor respecta regulile referitoare la semne?","a":["in timpul crepusculului.","pe timpul zilei.","ziua sau noaptea, cand sunt iluminate."],"c":1},{"n":66,"s":"nav","q":"Lumina alba asezata deasupra axului longitudinal al navei, aratand o lumina neintrerupta pe un arc de orizont de 22.5 astfel ca sa arate 22.5 inapoia traversului fiecarui bord este:","a":["lumina de pupa.","lumina de catarg.","lumina de remorcaj."],"c":1},{"n":67,"s":"nav","q":"Lumina verde din tribord si lumina rosie din babord, vizibile pe un arc de 112.5 adica de la prova pana la 22.5 inapoia traversului, reprezinta ceea ce se intelege prin expresia:","a":["lumina de bord.","lumina de pupa.","lumina de remorcaj."],"c":0},{"n":68,"s":"nav","q":"Ce se intelege prin expresia \"lumina de catarg\"?","a":["orice lumina alba instalata pe catargul unei nave la o inaltime prevazuta de normele din registru.","orice lumina alba vizibila pe tot orizontul.","o lumina alba asezata deasupra axului longitudinal al navei, aratand o lumina neintrerupta pe un arc de orizont de 225, astfel ca sa arate 22.5 inapoia traversului fiecarui bord."],"c":2},{"n":69,"s":"nav","q":"Ce se intelege prin expresia \"lumina de bord\"?","a":["lumina verde din tribord si lumina rosie din babord, vizibile pe un arc de 112.5, adica la prova pana la 22.5 inapoia traversului.","lumina alba din borduri, de la scarile de acces.","lumina alba de la scarile exterioare."],"c":0},{"n":70,"s":"nav","q":"Lumina alba asezata cat mai aproape posibil in pupa, aratand o lumina neintrerupta pe un arc de 135 cate 67.5 in fieare bord este:","a":["lumina de ancora pupa.","lumina de remorcaj.","lumina de pupa."],"c":2},{"n":71,"s":"nav","q":"Ce se intelege prin expresia \"lumina de pupa\"?","a":["o lumina alba instalata la pupa unei nave.","o lumina asezata cat mai aproape posibil in pupa, aratand o lumina neintrerupta pe un arc de 135, cate 67.5 in fiecare bord.","o lumina alba instalata la pupa, care arata ca o lumina intrerupta pe un arc de cerc de 135, cate 67.5 in fiecare bord."],"c":1},{"n":72,"s":"nav","q":"Lumina galbena asezata cat mai aproape posibil in pupa aratand o lumina de 135, cate 67.5 in fiecare bord este:","a":["lumina de pupa.","lumina de remorcaj.","lumina de ancora pupa."],"c":1},{"n":73,"s":"nav","q":"Trei lumini in pozitie verticala din care luminile de sus si de jos rosii si lumina din mijloc alba sunt luminile purtate de o nava:","a":["cu capacitate de manevra redusa cand nu este in mars.","nestapana pe manevra sa.","stanjenita de pescajul ei cand nu este in mars."],"c":0},{"n":74,"s":"nav","q":"Ce se intelege prin expresia \"lumina de remorcaj\"?","a":["o lumina alba asezata deasupra luminii de la pupa dupa care se guverneaza in timpul remorcajului.","o lumina galbena neintrerupta vizibila la 360.","o lumina galbena asezata cat mai aproape posibil de pupa, aratand o lumina neintrerupta pe un arc de cerc de 135, cate 67.5 in fiecare bord."],"c":2},{"n":75,"s":"nav","q":"Luminile rosu-alb-rosu dispuse pe verticala, lumina de ancora de la pupa sunt luminile purtate de o nava:","a":["nestapana pe manevra la ancora.","cu capacitate de manevra redusa la ancora.","stanjenita de pescajul ei la ancora."],"c":1},{"n":76,"s":"nav","q":"Lumina neintrerupta pe un arc de orizont de 360 este:","a":["lumina de catarg.","lumina cu sclipiri regulate.","lumina vizibila pe intreg orizontul."],"c":2},{"n":77,"s":"nav","q":"Trei semne suprapuse din care semnul superior si inferior cate o bula, iar cel din mijloc un bicon sunt semnele purtate de o nava:","a":["nestapana pe manevra sa.","stanjenita de pescajul ei.","cu capacitate de manevra redusa."],"c":2},{"n":78,"s":"nav","q":"Ce se intelege prin expresia \"lumina vizibila pe intreg orizontul\"?","a":["lumina neintrerupta pe un arc de de orizont de 360","lumina neintrerupta vizibila la prova si in borduri.","lumina neintrerupta vizibila pe un arc de orizont de 180"],"c":0},{"n":79,"s":"nav","q":"O lumina cu sclipiri regulate a carei frecventa este de 120 sclipiri pe minut sau mai mult, reprezinta ceea ce se intelege prin expresia:","a":["lumina de bord.","lumina cu sclipiri.","lumina de remorcaj."],"c":1},{"n":80,"s":"nav","q":"O bula la prova si trei semne dispuse vertical, dintre care semnul superior si inferior bule si cel din mijloc bicon, montate in locul cel mai vizibil sunt semnele purtate de o nava:","a":["cu capacitate de manevra redusa la ancora.","stanjenita de pescajul ei la ancora.","nestapana pe manevra la ancora."],"c":0},{"n":81,"s":"nav","q":"Ce se intelege prin expresia \"lumina cu sclipiri\"?","a":["o lumina cu sclipiri regulate cu frecventa de 60 sclipiri pe minut.","o lumina cu sclipiri regulate cu frecventa de 120 sclipiri pe minut sau mai mult.","o lumina cu sclipiri regulate foarte repezi."],"c":1},{"n":82,"s":"nav","q":"La ce distanta trebuie sa se vada luminile de la catarge pentru navele cu lungimea intre 12 si 20 m?","a":["1-2 Mm.","2 Mm.","3 Mm."],"c":2},{"n":83,"s":"nav","q":"La ce distanta trebuie sa se vada luminile de la catarge pentru navele cu lungimea mai mica de 12 m?","a":["3 Mm.","2 Mm.","1 Mm."],"c":1},{"n":84,"s":"nav","q":"Un cilindru negru reprezinta semnul purtat de o nava:","a":["stanjenita de pescajul sau.","cu capacitate de manevra redusa.","nestapana pe manevra"],"c":0},{"n":85,"s":"nav","q":"La ce distanta trebuie sa se vada luminile din borduri pentru navele cu o lungime intre 12 si 50 m?","a":["3 Mm.","2 Mm.","1,5 Mm."],"c":1},{"n":86,"s":"nav","q":"La ce distanta trebuie sa se vada luminile din borduri pentru navele cu o lungime mai mica de 12 m?","a":["2 Mm.","0,5 Mm.","1 Mm."],"c":2},{"n":87,"s":"nav","q":"La ce distanta trebuie sa se vada lumina din pupa pentru navele cu o lungime intre 12 si 50 m?","a":["3 Mm.","2 Mm.","1 Mm."],"c":1},{"n":88,"s":"nav","q":"La ce distanta trebuie sa se vada lumina din pupa pentru navele cu o lungime mai mica de 12 m?","a":["3 Mm.","1,5 Mm.","2 Mm."],"c":2},{"n":89,"s":"nav","q":"La ce distanta trebuie sa se vada lumina de remorcaj pentru navele cu o lungime mai mare de 50 m?","a":["3 Mm.","4 Mm.","3,5 Mm."],"c":0},{"n":90,"s":"nav","q":"La ce distanta trebuie sa se vada lumina de remorcaj pentru navele cu o lungime intre 12 si 50 m?","a":["3 Mm.","2 Mm.","5 Mm."],"c":1},{"n":91,"s":"nav","q":"La ce distanta trebuie sa se vada lumina de remorcaj pentru navele cu o lungime mai mica de 12 m?","a":["1 Mm.","3 Mm.","2 Mm."],"c":2},{"n":92,"s":"nav","q":"La 2 Mm se vad luminile albe, rosii, verzi sau galbene pe intreg orizontul la navele:","a":["cu lungimea mai mare de 50 m.","cu lungimea mai mica de 100 m.","cu lungimea intre 12 si 20 m."],"c":2},{"n":93,"s":"nav","q":"La ce distanta trebuie sa se vada lumina alba, rosie, verde sau galbena vizibila pe intreg orizontul, pentru navele cu lungimea intre 12 si 50 m?","a":["3 Mm.","2 Mm.","1 Mm."],"c":1},{"n":94,"s":"nav","q":"Ce lumini trebuie sa poarte o nava cu perna de aer in exploatare fara pescaj?","a":["aceleasi lumini ca o nava cu propulsie mecanica in mars.","o lumina galbena cu sclipiri vizibile pe tot orizontul.","luminile unei nave cu propulsie mecanica in mars plus o lumina galbena cu sclipiri vizibila pe tot orizontul."],"c":2},{"n":95,"s":"nav","q":"Ce lumini trebuie sa poarte o nava cu propulsie mecanica in mars cu lungimea mai mare de 7 m si a carei viteza depaseste 7 Nd?","a":["o lumina alba vizibila peste tot orizontul si daca este posibil si luminile din borduri.","luminile din borduri.","o lumina alba care poate fi ridicata la nevoie."],"c":0},{"n":96,"s":"nav","q":"La ce distanta trebuie sa se vada lumina alba vizibila pe tot orizontul, a unei nave sau obiect de forma nedefinita, partial in imersiune, care este remorcat?","a":["3 Mm.","2Mm.","1 Mm."],"c":0},{"n":97,"s":"nav","q":"Ce lumini trebuie sa poarte obiectele sau navele remorcate, altele decat cele cu forma nedefinita?","a":["luminile de catarg si lumina de pupa.","luminile din borduri si lumina de pupa.","luminile de remorcher si lumina de pupa."],"c":1},{"n":98,"s":"nav","q":"Ce lumini trebuie sa poarte o nava impinsa inainte cand formeaza o singura unitate?","a":["trebuie sa poarte la extremitatea prova luminile din borduri.","lumina de catarg si luminile din borduri.","lumina de catarg si lumina de pupa."],"c":0},{"n":99,"s":"nav","q":"Ce lumini tebuie sa poarte o nava remorcata la ureche?","a":["luminile de catarg si lumina de pupa.","lumina de pupa si luminile din borduri la extremitatea prova.","luminile de borduri la extremitatea prova."],"c":1},{"n":100,"s":"nav","q":"Luminile din borduri si lumina din pupa sunt luminile pe care le poarta o nava:","a":["in seviciul de pilotaj si este in mars.","cu vele cand este la ancora.","cu vele in mars."],"c":2},{"n":101,"s":"nav","q":"Ce lumini poarta o nava cu vele in mars?","a":["luminile din borduri.","luminile de catarg si luminile din borduri.","luminile din borduri si lumina de pupa."],"c":2},{"n":102,"s":"nav","q":"Luminile din borduri si lumina din pupa, reunite intr-un felinar este purtat de :","a":["o nava cu vele mai mica de 7 m, in mars.","o nava cu rame.","o nava cu vele la ancora."],"c":0},{"n":103,"s":"n al in apele nationale navigabile ale Romaniei?","a":["amenda de la 2.000 la 5.000 lei","amenda de la 1.000 la 5.000 lei","amenda de la 5.000 la 20.000 lei"],"c":0},{"n":20,"s":"leg","q":"Cum se sanctioneaza refuzul de a se supune cercetarilor intreprinse de ANR sau de a pune la dispozitia ANR documentele si datele necesare investigarii:","a":["amenda de la 1.000 la 5.000 lei","amenda de la 30.000 la 50.000 lei","amenda de la 10.000 la 20.000 lei"],"c":1},{"n":21,"s":"leg","q":"Cum se sanctioneaza refuzul de a se supune controlului ANR","a":["amenda de la 1.000 la 5.000 lei","amenda de la 5.000 la 20.000 lei","amenda de la 20.000 la 30.000 lei"],"c":2},{"n":22,"s":"leg","q":"Nepredarea la ANR in termen de 5 zile de la comunicarea deciziei de suspendare sau anulare a documentului de atestare se sanctioneaza:","a":["amenda de la 100 la 500 lei","amenda de la 100 la 1.000 lei","amenda de la 1.000 la 5.000 lei"],"c":0},{"n":23,"s":"leg","q":"Constatarea contraventiilor si aplicarea sanctiunilor prevazute de HG 1704/2024 se face de catre:","a":["personalul imputernicit al ANR","personal ANR in asistenta reprezentant politie transporturi navale","personalul ANR in asistenta reprezentant Administratia Portuara"],"c":0},{"n":24,"s":"leg","q":"Se poate constata contraventia fara oprirea navei?","a":["da","nu","da, daca savarsirea contraventiei este probata cu un mijloc tehnic"],"c":2},{"n":25,"s":"leg","q":"Se poate constata contraventia in lipsa contravenientului?","a":["nu","da, daca savarsirea contraventiei este probata cu un mijloc tehnic","da"],"c":1}];

const PER = 20;
const SECT = { nav:'Navigatie / COLREG', pa:'Prim ajutor', leg:'Legislatie' };
const KEY = 'examState-v1';

const cards = [];
for (let i = 0; i < QUESTIONS.length; i += PER) cards.push(QUESTIONS.slice(i, i + PER));

let state = { cards:{}, wrong:[] };
let view = { name:'home' };
const app = document.getElementById('app');

/* ---------- stocare ----------
   Implicit: localStorage, pe fiecare dispozitiv separat.
   Daca SYNC_URL este completat, starea se sincronizeaza prin acel endpoint,
   iar localStorage ramane copie locala pentru cazul in care reteaua cade.   */
const SYNC_URL = '';          // ex. https://examen-sync.<subdomeniu>.workers.dev
let syncOk = SYNC_URL !== '';

function band(score, total){
  const s = Math.round(score / total * 20);
  if (s >= 19) return 'g';
  if (s >= 17) return 'y';
  return 'r';
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function readLocal(){
  try { const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; }
  catch (e) { return null; }
}
function writeLocal(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

async function load(){
  const local = readLocal();
  if (local) state = local;

  if (SYNC_URL){
    try {
      const r = await fetch(SYNC_URL, { cache:'no-store' });
      if (r.ok){
        const remote = await r.json();
        // castiga starea cu mai multe fise rezolvate; la egalitate, cea mai recenta
        const nL = local  ? Object.keys(local.cards  || {}).length : -1;
        const nR = remote ? Object.keys(remote.cards || {}).length : -1;
        if (nR > nL) { state = remote; writeLocal(); }
        else if (nR === nL && remote && remote.ts && (!local || !local.ts || remote.ts > local.ts)) {
          state = remote; writeLocal();
        }
      }
    } catch (e) { syncOk = false; }
  }
  if (!state.cards) state.cards = {};
  if (!state.wrong) state.wrong = [];
}

async function save(){
  state.ts = Date.now();
  writeLocal();
  if (!SYNC_URL) return;
  try {
    const r = await fetch(SYNC_URL, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(state)
    });
    if (!r.ok) throw new Error(r.status);
    syncOk = true;
  } catch (e) {
    syncOk = false;
    note('Salvat local. Sincronizarea cu celalalt dispozitiv nu a reusit.');
  }
}

function note(msg){
  const n = document.createElement('div');
  n.textContent = msg;
  n.style.cssText = 'position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:var(--port);color:#fff;padding:0.417rem 0.75rem;border-radius:0.167rem;font-size:.9375rem;z-index:9;max-width:90vw';
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 5000);
}

/* ---------- ecran principal ---------- */
function home(){
  const done = Object.keys(state.cards).length;
  const bars = cards.map((c, i) => {
    const r = state.cards[i+1];
    return `<i class="${r ? band(r.best, c.length) : ''}"></i>`;
  }).join('');

  const tiles = cards.map((c, i) => {
    const r = state.cards[i+1];
    const cls = r ? band(r.best, c.length) : '';
    const sc  = r ? `<div class="sc">${r.best}</div><div class="st">din ${c.length}</div>`
                  : `<div class="sc" style="color:var(--chart-dim)">-</div><div class="st">${c.length} intrebari</div>`;
    return `<button class="tile ${cls}" data-card="${i+1}">
      <div class="no">Fisa ${i+1}</div>${sc}</button>`;
  }).join('');

  app.innerHTML = `
    <div class="top">
      <h1>Examen clasa C</h1>
      <div class="sub">${QUESTIONS.length} intrebari  /  ${cards.length} fise</div>
    </div>
    <div class="overall">${bars}</div>
    <p class="overall-note">${done} din ${cards.length} fise rezolvate${state.wrong.length ? `  /  ${state.wrong.length} greseli de revazut` : ''}${SYNC_URL ? (syncOk ? '  /  sincronizat' : '  /  doar pe acest dispozitiv') : '  /  doar pe acest dispozitiv'}</p>
    <div class="grid">${tiles}</div>
    <div class="acts">
      <button class="btn" id="rand">20 intrebari la intamplare</button>
      <button class="btn" id="mist" ${state.wrong.length ? '' : 'disabled'}>Revezi greselile (${state.wrong.length})</button>
      <button class="btn ghost" id="reset">Sterge tot</button>
    </div>`;

  app.querySelectorAll('[data-card]').forEach(b =>
    b.onclick = () => start(+b.dataset.card, cards[+b.dataset.card - 1]));
  app.querySelector('#rand').onclick = () => {
    const pool = [...QUESTIONS].sort(() => Math.random() - .5).slice(0, PER);
    start(null, pool);
  };
  app.querySelector('#mist').onclick = () => {
    const set = new Set(state.wrong);
    const pool = QUESTIONS.filter(q => set.has(q.n)).slice(0, PER);
    if (pool.length) start('mistakes', pool);
  };
  app.querySelector('#reset').onclick = async () => {
    if (!confirm('Stergi toate rezultatele salvate?')) return;
    state = { cards:{}, wrong:[] };
    await save(); home();
  };
}

/* ---------- chestionar ---------- */
function start(id, qs){
  view = { name:'quiz', id, qs, i:0, answers:new Array(qs.length).fill(null) };
  quiz();
}

function quiz(){
  const v = view, q = v.qs[v.i];
  const ticks = v.qs.map((_, i) =>
    `<i class="${i === v.i ? 'cur' : (v.answers[i] !== null ? 'done' : '')}" data-go="${i}"></i>`).join('');
  const opts = q.a.map((t, i) =>
    `<button class="opt ${v.answers[v.i] === i ? 'sel' : ''}" data-opt="${i}">
       <span class="k">${'ABC'[i]}</span><span>${esc(t)}</span></button>`).join('');
  const allDone = v.answers.every(a => a !== null);
  const last = v.i === v.qs.length - 1;

  app.innerHTML = `
    <div class="qhead">
      <button class="back" id="back"><- Inapoi la fise</button>
      <span class="pos">${v.i + 1} / ${v.qs.length}</span>
    </div>
    <div class="ticks">${ticks}</div>
    <p class="sect">${SECT[q.s]}  /  intrebarea ${q.n}</p>
    <p class="qtext">${esc(q.q)}</p>
    <div class="opts">${opts}</div>
    <div class="nav">
      <button class="btn" id="prev" ${v.i === 0 ? 'disabled' : ''}>Anterioara</button>
      ${last
        ? `<button class="btn primary" id="fin" ${allDone ? '' : 'disabled'}>Trimite raspunsurile</button>`
        : `<button class="btn primary" id="next">Urmatoarea</button>`}
    </div>
    ${last && !allDone ? `<p class="hist">Mai ai ${v.answers.filter(a => a === null).length} intrebari fara raspuns.</p>` : ''}`;

  app.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => {
    v.answers[v.i] = +b.dataset.opt;
    if (v.i < v.qs.length - 1) { v.i++; quiz(); } else quiz();
  });
  app.querySelectorAll('[data-go]').forEach(t => t.onclick = () => { v.i = +t.dataset.go; quiz(); });
  app.querySelector('#back').onclick = () => { if (confirm('Iesi fara sa trimiti? Raspunsurile se pierd.')) home(); };
  const p = app.querySelector('#prev'); if (p) p.onclick = () => { v.i--; quiz(); };
  const n = app.querySelector('#next'); if (n) n.onclick = () => { v.i++; quiz(); };
  const f = app.querySelector('#fin'); if (f) f.onclick = finish;
}

/* ---------- rezultat ---------- */
async function finish(){
  const v = view;
  let score = 0;
  const wrongNow = [];
  v.qs.forEach((q, i) => { if (v.answers[i] === q.c) score++; else wrongNow.push(q.n); });

  if (typeof v.id === 'number'){
    const prev = state.cards[v.id];
    state.cards[v.id] = {
      best: prev ? Math.max(prev.best, score) : score,
      last: score, tries: (prev?.tries || 0) + 1, ts: Date.now()
    };
  }
  const set = new Set(state.wrong);
  v.qs.forEach((q, i) => { if (v.answers[i] === q.c) set.delete(q.n); else set.add(q.n); });
  state.wrong = [...set];
  await save();

  const b = band(score, v.qs.length);
  const verdict = { g:'Rezultat bun.', y:'Aproape. Revezi greselile.', r:'Insuficient. Mai lucreaza la aceasta fisa.' }[b];

  const items = v.qs.map((q, i) => {
    const ok = v.answers[i] === q.c;
    return `<div class="item ${ok ? 'ok' : ''}">
      <p class="q">${i + 1}. ${esc(q.q)}</p>
      ${ok
        ? `<p class="line"><span class="good">${'ABC'[q.c]} - ${esc(q.a[q.c])}</span></p>`
        : `<p class="line"><span class="lab">Ai ales:</span> <span class="bad">${'ABC'[v.answers[i]]} - ${esc(q.a[v.answers[i]])}</span></p>
           <p class="line"><span class="lab">Corect:</span> <span class="good">${'ABC'[q.c]} - ${esc(q.a[q.c])}</span></p>`}
    </div>`;
  }).join('');

  const title = typeof v.id === 'number' ? `Fisa ${v.id}` : (v.id === 'mistakes' ? 'Greselile tale' : '20 la intamplare');
  const rec = typeof v.id === 'number' ? state.cards[v.id] : null;

  app.innerHTML = `
    <div class="top"><h1>${title}</h1><div class="sub">rezultat</div></div>
    <div class="score ${b}">
      <div class="big">${score}</div>
      <div class="of">din ${v.qs.length}</div>
    </div>
    <p class="verdict">${verdict}</p>
    ${rec ? `<p class="hist" style="text-align:center">Cel mai bun: ${rec.best}  /  incercarea ${rec.tries}</p>` : ''}
    <div class="acts" style="justify-content:center">
      <button class="btn" id="again">Incearca din nou</button>
      <button class="btn primary" id="home">Inapoi la fise</button>
    </div>
    <div class="rev">
      <h2>${wrongNow.length ? `${wrongNow.length} greseli` : 'Toate corecte'}</h2>
      ${items}
    </div>`;

  app.querySelector('#home').onclick = home;
  app.querySelector('#again').onclick = () => start(v.id, v.qs);
  window.scrollTo(0, 0);
}

load().then(home);
</script>
