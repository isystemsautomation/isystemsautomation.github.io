<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Examen clasa C — 494 întrebări</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#0A2E38;        /* apă adâncă */
  --shoal:#12414E;      /* suprafețe ridicate */
  --shoal-2:#1B5464;
  --chart:#EDE7D6;      /* hârtie de hartă */
  --chart-dim:#9DB2B8;
  --port:#C8362F;       /* roșu babord */
  --starboard:#2E9E5B;  /* verde tribord */
  --sector:#D9A22B;     /* sector galben */
  --line:rgba(237,231,214,.14);
  --r:4px;
  --sp:16px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--sea); color:var(--chart);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:16px; line-height:1.5; font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--sector);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:760px;margin:0 auto;padding:calc(var(--sp)*1.5) var(--sp) 64px}

/* ---- antet ---- */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
     padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:22px}
.top h1{margin:0;font-size:1.0625rem;font-weight:600;letter-spacing:.01em}
.top .sub{color:var(--chart-dim);font-size:.8125rem}

/* ---- bara de progres general ---- */
.overall{display:flex;gap:3px;margin-bottom:8px}
.overall i{flex:1;height:5px;border-radius:1px;background:var(--shoal)}
.overall i.g{background:var(--starboard)} .overall i.y{background:var(--sector)}
.overall i.r{background:var(--port)}
.overall-note{color:var(--chart-dim);font-size:.8125rem;margin:0 0 26px}

/* ---- grila de fișe ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.tile{position:relative;background:var(--shoal);border:1px solid var(--line);
      border-radius:var(--r);padding:12px 12px 10px;text-align:left;
      display:flex;flex-direction:column;gap:2px;min-height:88px;
      transition:background .12s ease,border-color .12s ease}
.tile:hover{background:var(--shoal-2)}
.tile .no{font-size:.75rem;color:var(--chart-dim)}
.tile .sc{font-size:1.5rem;font-weight:600;line-height:1.1;margin-top:auto}
.tile .st{font-size:.75rem;color:var(--chart-dim)}
.tile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
             border-radius:0 0 var(--r) var(--r);background:transparent}
.tile.r::after{background:var(--port)} .tile.y::after{background:var(--sector)}
.tile.g::after{background:var(--starboard)}
.tile.g .sc{color:var(--starboard)} .tile.y .sc{color:var(--sector)}
.tile.r .sc{color:var(--port)}

/* ---- bara de acțiuni ---- */
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 0}
.btn{background:var(--shoal);border:1px solid var(--line);border-radius:var(--r);
     padding:10px 16px;font-size:.9375rem;font-weight:500}
.btn:hover{background:var(--shoal-2)}
.btn.primary{background:var(--starboard);border-color:var(--starboard);color:#06231A}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none}

/* ---- ecran întrebare ---- */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qhead .back{color:var(--chart-dim);font-size:.875rem}
.qhead .pos{margin-left:auto;color:var(--chart-dim);font-size:.875rem}
.ticks{display:flex;gap:3px;margin-bottom:22px}
.ticks i{flex:1;height:4px;border-radius:1px;background:var(--shoal);cursor:pointer}
.ticks i.done{background:var(--chart-dim)}
.ticks i.cur{background:var(--chart)}
.sect{color:var(--chart-dim);font-size:.8125rem;margin:0 0 6px}
.qtext{font-size:1.1875rem;font-weight:500;line-height:1.4;margin:0 0 22px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;
     background:var(--shoal);border:1px solid var(--line);border-radius:var(--r);
     padding:14px 16px;line-height:1.45;transition:background .12s,border-color .12s}
.opt:hover{background:var(--shoal-2)}
.opt .k{flex:0 0 auto;font-weight:600;color:var(--chart-dim);min-width:1.2em}
.opt.sel{border-color:var(--chart);background:var(--shoal-2)}
.opt.sel .k{color:var(--chart)}
.nav{display:flex;gap:8px;margin-top:22px}
.nav .btn{flex:1}

/* ---- rezultat ---- */
.score{text-align:center;padding:34px 0 8px}
.score .big{font-size:4rem;font-weight:600;line-height:1}
.score .of{color:var(--chart-dim);font-size:.9375rem;margin-top:4px}
.score.g .big{color:var(--starboard)} .score.y .big{color:var(--sector)}
.score.r .big{color:var(--port)}
.verdict{text-align:center;font-size:1rem;margin:10px 0 26px}
.rev{margin-top:30px}
.rev h2{font-size:.9375rem;font-weight:600;margin:0 0 12px;padding-bottom:8px;
        border-bottom:1px solid var(--line)}
.item{border-left:3px solid var(--port);padding:2px 0 2px 14px;margin-bottom:22px}
.item.ok{border-left-color:var(--starboard)}
.item .q{font-weight:500;margin:0 0 8px}
.item .line{font-size:.9375rem;margin:0 0 4px}
.item .bad{color:var(--port)} .item .good{color:var(--starboard)}
.item .lab{color:var(--chart-dim)}
.empty{color:var(--chart-dim);text-align:center;padding:40px 0}
.hist{color:var(--chart-dim);font-size:.8125rem;margin-top:6px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const QUESTIONS =
[{"n":1,"s":"nav","q":"Căror nave li se aplică prevederile Colreg-1972?","a":["tuturor navelor care navigă în apele internaționale.","tuturor navelor care navigă în rade, strâmtori și marea liberă.","tuturor navelor aflate în largul mării ori pe toate apele învecinate accesibile navelor maritime."],"c":2},{"n":2,"s":"nav","q":"Tuturor navelor aflate în largul mării ori pe toate apele învecinate accesibile navelor maritime li se aplică prevederile:","a":["COLREG-1972.","R.N.D.","Codului ISPS."],"c":0},{"n":3,"s":"nav","q":"Dispozițiile Regulamentului împiedică aplicarea prescripțiilor speciale stabilite de către autoritatea competentă referitoare la navigația în rade, porturi, pe fluvii, lacuri sau căi de navigaţie interioară accesibile navelor maritime?","a":["da.","nu.","nu este precizat."],"c":1},{"n":4,"s":"nav","q":"Cum influenţează prevederile Regulamentului prescripţiile speciale referitoare la navigaţia în rade, porturi, pe fluvii, lacuri sau căi de navigaţie interioară accesibile navelor maritime?","a":["dispoziţiile regulamentului nu trebuie să împiedice aplicarea prescripţiilor speciale stabilite de către autoritatea competentă, dar asemenea prescripţii speciale trebuie să fie cât mai conforme cu prezentele reguli.","autoritatea competentă nu este obligată să ţină seama de prescripţiile Regulamentului.","în toate situaţiile se vor aplica prevederile Regulamentului."],"c":0},{"n":5,"s":"nav","q":"Guvernul unui stat poate stabili prescripţiile speciale cu privire la numărul luminilor de poziţie, a semnalelor luminoase, prescripţii care să fie astfel încât să facă imposibilă confundarea lor cu Regulamentul?","a":["nu.","nu este precizat.","da."],"c":2},{"n":6,"s":"nav","q":"Dispoziţiile Regulamentului scutesc nava, comandantul sau armatorul de consecinţele unei neglijenţe oarecare în ceea ce priveşte aplicarea Regulamentului sau în ceea ce priveşte luarea tuturor măsurilor cerute de o bună practică marinărească?","a":["nu este precizat.","da.","nu."],"c":2},{"n":7,"s":"nav","q":"Când este exonerată o navă, comanantul sau armatorul de consecinţele unei neglijenţe sau de neluarea tuturor măsurilor cerute de o bună practică marinărească?","a":["aplicarea regulilor scuteşte nava, comandantul sau armatorul de orice răspundere.","conformarea întocmai la prevederile regulii \"navă privilegiată\" scuteşte nava, comandantul sau armatorul de orice răspundere.","dispoziţiile Regulamentului nu scutesc nava, comandantul sau armatorul de consecinţele unei neglijenţe oarecare în ceea ce priveşte aplicarea Regulamentului sau în ceea ce priveşte luarea tuturor măsurilor cerute de o bună practică marinărească."],"c":2},{"n":8,"s":"nav","q":"Când există riscul unei coliziuni, precum şi în toate împrejurările deosebite sunt permise:","a":["abaterea de la prevederile Regulamentului.","abateri de la prevederile autorităţilor portuare.","abateri de la prevederile legilor specifice."],"c":0},{"n":9,"s":"nav","q":"Când sunt permise abateri de la prevederile Regulamentului?","a":["în apele naţionale, rade şi în toate apele învecinate accesibile navelor maritime.","când există pericol de navigaţie, riscul unei coliziuni, precum şi în toate împrejurările deosebite.","indiferent de situaţie, nu este permisă abaterea de la prevederile Regulamentului."],"c":1},{"n":10,"s":"nav","q":"Ce se înţelege prin expresia\"navă\", conform Regulamentului?","a":["orice construcţie sau aparat, de orice natură, capabil să plutească pe apă fără propulsie.","orice construcţie sau orice aparat, de orice natură ar fi, inclusiv construcţiile fără pescaj şi hidro avioane, folosite sau susceptibile de a fi folosite ca mijloc de transport pe apă.","orice corp plutitor cu orice mijloc de propulsie."],"c":1},{"n":11,"s":"nav","q":"Ce se înţelege prin \"navă cu propulsie mecanică\"?","a":["orice navă pusă în mişcare de către o maşină.","navele care folosesc ca mijloc de propulsie un motor Diesel.","toate navele care se pot deplasa pe apă, cu excepţia navelor cu vele."],"c":0},{"n":12,"s":"nav","q":"O navă care navigă cu vele, chiar dacă are o maşină proprie, cu condiţia ca aceasta să nu fie folosită, reprezintă:","a":["o navă cu vele.","o navă cu propulsie mecanică, care foloseşte şi velele.","o navă care foloseşte ca mijloc de propulsie forţa vântului."],"c":0},{"n":13,"s":"nav","q":"Ce se înţelege prin expresia \"navă cu vele\"?","a":["o navă care foloseşte ca mijloc de propulsie forţa vântului.","o navă cu propulsie mecanică, care foloseşte şi vele.","o navă care navigă cu vele, chiar dacă are o maşină proprie, cu condiţia ca aceasta să nu fie folosită."],"c":2},{"n":14,"s":"nav","q":"O navă care din cauza unei împrejurări excepţionale nu este în măsură să manevreze şi deci, nu poate să se îndepărteze din drumul altei nave trebuie considerată:","a":["nava nu este stăpână pe manevra sa.","navă cu capacitate de manevră redusă.","navă stânjenită de pescajul său."],"c":0},{"n":15,"s":"nav","q":"Ce se înţelege prin expresia \"navă cu capacitate de manevră redusă\"?","a":["o navă a cărei capacitate de manevră conform Regulamentului este limitată prin natura lucrărilor sale şi care, în consecinţă, nu se poate îndepărta din drumul altei nave.","o navă cu avarii accidentale la cârmă şi/sau maşină, în curs de remediere.","o navă care nu se poate abate din drumul său, datorită unor pericole de navigaţie."],"c":0},{"n":16,"s":"nav","q":"O navă cu propulsie mecanică, care din cauza pescajului şi a adâncimii apei sub chilă poate să-şi modifice cu greu drumul, se consideră :","a":["navă stânjenită de pescajul său.","navă cu lungime mai mare de 200 m","navă cu capacitate de manevră redusă."],"c":0},{"n":17,"s":"nav","q":"O navă care nu este nici la ancoră, nici legată la cheu, nici eşuată se consideră:","a":["navă \"în marş\".","navă în derivă.","navă care ţine la capă."],"c":0},{"n":18,"s":"nav","q":"Când una dintre nave poate fi observată vizual de către cealaltă navă, se consideră:","a":["navă în siguranţă.","nave aflate în vedere.","nave în marş."],"c":1},{"n":19,"s":"nav","q":"Când două nave se consideră în vedere?","a":["când se observă vizual reciproc.","numai când una dintre ele poate fi observată vizual de către cealaltă.","când navele se află în limita de observare cu radarul."],"c":1},{"n":20,"s":"nav","q":"Cum trebuie să se asigure veghea la bordul navei?","a":["trebuie să se asigure în permanenţă o veghe vizuală şi auditivă corespunzătoare, folosind în acelaşi timp toate mijloacele disponibile, potrivit cu împrejurările şi condiţiile existente, în aşa fel încât să permită o apreciere completă a situaţiei.","trebuie să se asigure în permanenţă o veghe vizuală pentru evitarea unei situaţii periculoase.","în condiţii de vizibilitate redusă, se va organiza o veghe corespunzătoare, pentru a aprecia existenţa unui pericol de coliziune."],"c":0},{"n":21,"s":"nav","q":"Pentru a se putea acţiona corect şi eficace pentru prevenirea unei coliziuni şi pentru ca nava să poată fi oprită pe o distanţă corespunzătoare împrejurărilor şi condiţiilor, se impune menţiunea de a naviga cu:","a":["viteză maximă.","viteză minimă.","viteză de siguranţă."],"c":2},{"n":22,"s":"nav","q":"Care sunt factorii care trebuie luaţi în consideraţie pentru determinarea \"vitezei de siguranţă\"?","a":["lungimea navei, calităţile nautice ale navei, puterea maşinii şi vizibilitatea.","pregătirea echipajului, condiţiile de navigaţie, vizibilitatea.","vizibilitatea, densitatea traficului, capacitatea de manevră a navei, noaptea-existenţa unui fundal luminos, starea vântului şi a mării, pescajul navei."],"c":2},{"n":23,"s":"nav","q":"Orice navă trebuie să folosească toate mijloacele disponibile corespunzătoare împrejurărilor şi condiţiilor externe pentru a stabili dacă există:","a":["un pericol de eşuare.","un pericol iminent.","un pericol de coliziune."],"c":2},{"n":24,"s":"nav","q":"Ce mijloace trebuie să folosească o navă pentru a stabili dacă există pericolul de coliziune?","a":["orice navă trebuie să folosească toate mijloacele disponibile corespunzătoare împrejurărilor şi condiţiilor extrene, pentru a stabili dacă există un pericol de coliziune.","orice navă trebuie să folosească toate mijloacele vizuale, pentru a stabili dacă există pericolul de coliziune.","orice navă trebuie să folosească radarul, pentru a stabili dacă există pericolul de coliziune."],"c":0},{"n":25,"s":"nav","q":"Când relevmentul compas la o navă care se apropie nu variază în mod apreciabil, se consideră :","a":["nave în vedere.","pericol de coliziune.","nave cu drumuri opuse."],"c":1},{"n":26,"s":"nav","q":"Când se consideră că există pericol de coliziune?","a":["când navele navigă în drumuri opuse.","când relevmentul compas la o navă care se apropie nu variază în mod apreciabil.","când viteza de apropiere între cele două nave este foarte mare."],"c":1},{"n":27,"s":"nav","q":"Cum trebuie să se execute o manevră pentru evitarea unei coliziuni?","a":["din timp, cu schimbări mici de drum, pentru a nu devia prea mult de la drumul navei.","hotărât, din timp şi conform cu buna practică marinărească.","hotărât, cu variaţii de viteză, pentru evitarea pericolului."],"c":1},{"n":28,"s":"nav","q":"Cum trebuie să se execute schimbările de drum şi/sau de viteză pentru evitarea ueni coliziuni?","a":["schimbări mici de drum şi/sau de viteză, pentru a nu devia prea mult de la drumul navei.","schimbări destul de mari de viteză şi mici de drum, pentru a nu devia prea mult de la drumul navei.","dacă împrejurările permit, să fie destul de mare, pentru a putea fi percepută imediat de orice navă care o observă vizual sau cu radarul."],"c":2},{"n":29,"s":"nav","q":"Dacă pentru evitarea unei coliziuni este suficientă numai schimbarea de drum, cum trebuie să fie executată?","a":["manevra se va face cu mult timp înainte, să fie substanţială şi să nu conducă la o altă situaţie de foarte mare apropiere.","se vor executa schimbări mari de drum, suficiente pentru evitarea coliziunii.","se va efectua o schimbare de drum suficientă pentru ca să se elimine orice pericol de coliziune."],"c":0},{"n":30,"s":"nav","q":"Manevra de evitare între nave se va efectua astfel încât să permită trecerea la:","a":["o distanţă maximă.","o distanţă de siguranţă.","o distanţă minimă."],"c":1},{"n":31,"s":"nav","q":"Până când se controlează eficacitatea unei manevre de evitare?","a":["până când navele vor fi la travers una faţă de cealaltă.","până când nava cealaltă va fi într-un unghi de 45° tribord/babord.","până când nava cealaltă a fost complet şi definitiv depăşită."],"c":2},{"n":32,"s":"nav","q":"Care este manevra cea mai indicată pentru a se câştiga mai mult timp pentru aprecierea situaţiei, atunci când trebuie să se evite o coliziune?","a":["reducerea vitezei sau opirea completă, stopând maşinile ori punându-le înapoi.","stoparea navei.","reducerea la minimum de viteză, până la limita guvernării."],"c":0},{"n":33,"s":"nav","q":"Cum se navigă în şenal sau cale navigabilă îngustă?","a":["pe mijlocul şenalului sau căii de acces.","cât mai aproape posibil de marginea exterioară din dreapta şenalului sau căii de acces respective, atunci când aceasta se poate face.","se va naviga întotdeauna cât mai aproape posibil de marginea exterioară a şenalului sau căii de acces, pentru asigurarea unei veghe corespunzătoare."],"c":1},{"n":34,"s":"nav","q":"Ce semnale pot da navele care navigă prin şenal şi se îndoiesc de intenţiile navei care traversează şenalul?","a":["un sunet lung şi două scurte.","un semnal de avertizare compus din cinci sunete scurte.","un semnal lung de atenţionare."],"c":1},{"n":35,"s":"nav","q":"Ce măsuri de siguranţă trebuie să ia o navă care se apropie de un cot aflat într-un şenal sau o cale de acces îngustă?","a":["să emită cinci sunete scurte (de avertizare)","să emită un semnal scurt şi să navige pe partea dreaptă a şenalului.","să emită un semnal lung şi să navige cu prudenţă şi vigilenţă."],"c":2},{"n":36,"s":"nav","q":"Schemelor de separare a traficului li se aplică reglementările referitoare la schemele de separare a traficului, adoptate de:","a":["guvernele ţărilor unde se află schemele.","Organizaţie.","Organizaţie şi guvernele anumitor ţări."],"c":1},{"n":37,"s":"nav","q":"Nava trebuie să navige pe banda de navigaţie corespunzătoare în direcţia generală a traficului şi să se îndepărteze,în măsura posibilului, de linia sau zona de separare a sensurilor de trafic atunci când trebuie să navige:","a":["în exteriorul unei scheme de separare a traficului.","în interiorul unei scheme de separare a traficului.","în interiorul unei benzi de separaţie."],"c":1},{"n":38,"s":"nav","q":"Cum trebuie să se angajeze o navă pentru intrarea sau ieşirea dintr-o schemă de separare a traficului?","a":["sub un unghi drept faţă de direcţia generală a traficului.","ca regulă generală pe la una din extremităţi,dar atunci când se angajează să intre sau să iasă,din orice parte,să facă manevra sub unghi cât mai mic faţă de direcţia traficului.","prin zona de separare a traficului,dar cu aprobarea autorităţilor care supraveghează navigaţia în schema de separare a traficului."],"c":1},{"n":39,"s":"nav","q":"Cum trebuie să întretaie o navă benzile de separaţie, când este obligată să o facă?","a":["sub un unghi cât mai mic faţă de direcţia generală a traficului şi cu viteza redusă.","sub un unghi cât mai mic faţă de direcţia generală a traficului şi cu viteză maximă.","pe cât posibil perpendicular faţă de direcţia generală a traficului."],"c":2},{"n":40,"s":"nav","q":"Zonele de navigaţie costieră pot fi folosite pentru traficul costier?","a":["în mod normal nu trebuie folosite pentru traficul direct, cu excepţia navelor mai mici de 20 m lungime şi a navelor cu vele.","pot fi folosite de toate navele aparţinând ţării riverane.","pot fi folosite de navele cu capacitate de manevră redusă."],"c":0},{"n":41,"s":"nav","q":"Când poate o navă să pătrundă într-o zonă de separare sau să taie o linie de separare?","a":["când condiţiile hidrometeorologice fac dificilă navigaţia în sensul general al traficului.","în caz de urgenţă, pentru evitarea unui pericol imediat, sau pentru a pescui într-o zonă de separare.","zona de separare nu va fi traversată în nici o situaţie."],"c":1},{"n":42,"s":"nav","q":"Cum trebuie să se navige în zone vecine cu extremităţile unei zone de separare a traficului?","a":["se va naviga în direcţia generală a traficului.","se vor semnaliza sonor şi vizual intenţiile de schimbare de drum.","cu atenţie deosebită."],"c":2},{"n":43,"s":"nav","q":"Este permisă ancorarea în schemele de separare a traficului?","a":["se va evita în măsura maximă a posibilului ancorarea atât în schema de separare, cât şi în zonele învecinate acesteia.","se poate ancora, dar se vor da toate semnalele prevăzute în prezentele reguli.","nu se poate ancora în nici o situaţie."],"c":0},{"n":44,"s":"nav","q":"Cum trebuie să navige navele care nu folosesc o schemă de separare a traficului?","a":["să folosească zonele de navigaţie costieră.","să se îndepărteze cât mai mult de zona de separare a traficului.","să navige în apropiere, dar să nu intersecteze linia de separare."],"c":1},{"n":45,"s":"nav","q":"Care sunt navele exceptate de la prevederile regulii referitoare la navigaţie în schemele de separare a traficului?","a":["navele cu capacitate de manevră redusă, angajate în manevra de menţinere a siguranţei navigaţiei.","navele cu defecţiuni la motorul principal.","navele cu avarii la cârmă."],"c":0},{"n":46,"s":"nav","q":"Ce navă trebuie să se abată din drumul navei ajunsă din urmă?","a":["nava care se află la o distanţă de 200 m.","nava care se află la o distanţă de 100 m.","nava care ajunge din urmă."],"c":2},{"n":47,"s":"nav","q":"Cum se comportă o navă care ajunge din urmă (depăşeşte) o altă navă?","a":["nava care ajunge din urmă o altă navă va avea prioritate.","nava ajunsă din urmă va manevra astfel încât să-i permită navei care o depăşeşte deplasarea.","orice navă care ajunge din urmă o altă navă trebuie să se abată din drumul navei ajunsă din urmă."],"c":2},{"n":48,"s":"nav","q":"Când se consideră că o navă ajunge din urmă altă navă?","a":["când vine dintr-o direcţie mai mare de 22°5 dinapoia traversului celeilalte nave, astfel încât noaptea se vede numai lumina din pupa şi luminile din bordurile navei ajunsă din urmă.","când vede lumina din pupa şi luminile din bordurile navei ajunsă din urmă.","când vede lumina catargului pupa şi luminile din pupa."],"c":0},{"n":49,"s":"nav","q":"Cum trebuie să manevreze o navă care nu poate stabili cu siguranţă că ajunge din urmă altă navă?","a":["să se considere navă privilegiată şi şă-şi menţină viteza şi drumul.","să se considere navă care ajunge din urmă şi să manevreze în consecinţă.","să dea semnalele corespunzătoare şi după edificare să procedeze conform situaţiei."],"c":1},{"n":50,"s":"nav","q":"Cum trebuie să manevreze două nave cu vele care se apropie una de alta, astfel încât există pericolul de coliziune şi primesc vântul din borduri diferite?","a":["nava care primeşte vântul din babord trebuie să se abată din drumul navei care primeşte vântul din tribord.","nava care primeşte vântul din tribord trebuie să se abată din drumul navei care primeşte vântul din babord.","nava care primeşte vântul din pupa trebuie să se abată din drumul navei care primeşte vântul din tribord."],"c":0},{"n":51,"s":"nav","q":"Cum trebuie să manevreze două nave cu vele care se apropie una de alta, astfel încât există pericolul de coliziune şi primesc vântul din acelaşi bord?","a":["nava care o vede pe cealaltă prin babord trebuie să se abată din drumul celeilalte nave.","nava care este în vânt se va abate din drumul navei de sub vânt.","nava care o vede pe cealaltă prin tribord trebuie să se abată din drumul celeilalte nave."],"c":1},{"n":52,"s":"nav","q":"Care este manevra unei nave care nu este obligată să se abată din drumul altei nave?","a":["trebuie să-şi menţină drumul şi viteza.","va schimba numai drumul, pentru a evita o situaţie periculoasă.","va reduce viteza sau va stopa, pentru a nu crea situaţii periculoase."],"c":0},{"n":53,"s":"nav","q":"Când trebuie să manevreze nava care nu este obligată să se abată din drumul altei nave?","a":["indiferent de situaţie, nu se va abate niciodată din drumul altei nave.","imediat ce i se pare evident faptul că nava care are obligaţia de a se abate din drumul său nu face manevra.","când în urma observării relevmentului şi-a dat seama că există pericolul de coliziune."],"c":1},{"n":54,"s":"nav","q":"Din drumul căror nave trebuie să se abată o navă cu propulsie mecanică în marş?","a":["navelor cu vele.","velierelor care navigă numai cu maşina.","velierelor care poartă la prova un semn conic negru, cu vârful în jos."],"c":0},{"n":55,"s":"nav","q":"Din drumul căror nave trebuie să se abată o navă cu vele în marş?","a":["navelor cu propulsie mecanică cu viteză mică.","navelor care nu sunt stăpâne pe manevra lor.","navelor petroliere sau navelor care transportă gaze lichefiate."],"c":1},{"n":58,"s":"nav","q":"Din drumul căror nave trebuie să se abată o navă stânjenită de pescajul său?","a":["navelor cu vele.","navelor nestăpâne pe manevra lor.","navelor petrolier sau navelor care transportă gaze lichefiate."],"c":1},{"n":59,"s":"nav","q":"Căror nave li se aplică regulile de conducerea navelor pe vizibilitate redusă?","a":["navelor care navigă în interiorul zonelor de vizibiliate redusă şi numai una dintre ele nu o vede pe cealaltă.","navelor care nu se văd una pe alta şi care navigă înlăuntrul sau în apropierea zonelor de vizibilitate redusă.","navelor care navigă în interiorul sau în apropierea zonelor de vizibilitate redusă şi observă una la alta numai luminile de catarg."],"c":1},{"n":60,"s":"nav","q":"Cu ce viteză trebuie să navige o navă în condiţii de vizibilitate redusă?","a":["cu viteză redusă şi veghe la prova.","cu viteză economică, dar cu radarul în funcţiune şi cu o veghe corespunzătoare, pentru a evita pericolul de coliziune.","cu o viteză de siguranţă adaptată împrejurărilor existente şi condiţiilor de vizibilitate redusă."],"c":2},{"n":61,"s":"nav","q":"Când se vor respecta regulile referitoare la \"lumini şi semne\"?","a":["în marş ziua şi noaptea.","pe orice vreme.","în staţionare ziua şi noaptea."],"c":1},{"n":62,"s":"nav","q":"În ce perioadă sunt respectate regulile referitoare la lumini?","a":["pe timpul nopţii.","pe timpul nopţii şi pe vizibilitate redusă.","de la apusul la răsăritul soarelui."],"c":2},{"n":63,"s":"nav","q":"Pe timpul zilei se vor respecta regulile cu privire la:","a":["lumini.","semne.","lumini şi semne."],"c":1},{"n":64,"s":"nav","q":"Când mai pot fi purtate luminile prevăzute de reguli?","a":["de la răsăritul la apusul soarelui, pe timp cu vizibilitate redusă, în toate împrejurările în care această măsură este necesară.","când vizibilitatea este sub 3 Mm.","în srâmtori, când vizibiliatea este redusă."],"c":0},{"n":65,"s":"nav","q":"Când se vor respecta regulile referitoare la semne?","a":["în timpul crepusculului.","pe timpul zilei.","ziua sau noaptea, când sunt iluminate."],"c":1},{"n":66,"s":"nav","q":"Lumina albă aşezată deasupra axului longitudinal al navei, arătând o lumină neîntreruptă pe un arc de orizont de 22°5 astfel ca să arate 22°5 înapoia traversului fiecărui bord este:","a":["lumina de pupa.","lumina de catarg.","lumina de remorcaj."],"c":1},{"n":67,"s":"nav","q":"Lumină verde din tribord şi lumină roşie din babord, vizibile pe un arc de 112°5 adică de la prova până la 22°5 înapoia traversului, reprezintă ceea ce se înţelege prin expresia:","a":["lumină de bord.","lumină de pupa.","lumină de remorcaj."],"c":0},{"n":68,"s":"nav","q":"Ce se înţelege prin expresia \"lumină de catarg\"?","a":["orice lumină albă instalată pe catargul unei nave la o înălţime prevăzută de normele din registru.","orice lumină albă vizibilă pe tot orizontul.","o lumină albă aşezată deasupra axului longitudinal al navei, arătând o lumină neîntreruptă pe un arc de orizont de 225°, astfel ca să arate 22°5 înapoia traversului fiecărui bord."],"c":2},{"n":69,"s":"nav","q":"Ce se înţelege prin expresia \"lumină de bord\"?","a":["lumină verde din tribord şi lumină roşie din babord, vizibile pe un arc de 112°5, adică la prova până la 22°5 înapoia traversului.","lumină albă din borduri, de la scările de acces.","lumină albă de la scările exterioare."],"c":0},{"n":70,"s":"nav","q":"Lumina albă aşezată cât mai aproape posibil în pupa, arătând o lumină neîntreruptă pe un arc de 135° câte 67°5 în fieare bord este:","a":["lumina de ancoră pupa.","lumina de remorcaj.","lumina de pupa."],"c":2},{"n":71,"s":"nav","q":"Ce se înţelege prin expresia \"lumină de pupa\"?","a":["o lumină albă instalată la pupa unei nave.","o lumină aşezată cât mai aproape posibil în pupa, arătând o lumină neîntreruptă pe un arc de 135°, câte 67°5 în fiecare bord.","o lumină albă instalată la pupa, care arată ca o lumină întreruptă pe un arc de cerc de 135°, câte 67°5 în fiecare bord."],"c":1},{"n":72,"s":"nav","q":"Lumina galbenă aşezată cât mai aproape posibil în pupa arătând o lumină de 135°, câte 67°5 în fiecare bord este:","a":["lumina de pupa.","lumina de remorcaj.","lumina de ancoră pupa."],"c":1},{"n":73,"s":"nav","q":"Trei lumini în poziţie verticală din care luminile de sus şi de jos roşii şi lumina din mijloc albă sunt luminile purtate de o navă:","a":["cu capacitate de manevră redusă când nu este în marş.","nestăpână pe manevra sa.","stânjenită de pescajul ei când nu este în marş."],"c":0},{"n":74,"s":"nav","q":"Ce se înţelege prin expresia \"lumină de remorcaj\"?","a":["o lumină albă aşezată deasupra luminii de la pupa după care se guvernează în timpul remorcajului.","o lumină galbenă neîntreruptă vizibilă la 360°.","o lumină galbenă aşezată cât mai aproape posibil de pupa, arătând o lumină neîntreruptă pe un arc de cerc de 135°, câte 67°5 în fiecare bord."],"c":2},{"n":75,"s":"nav","q":"Luminile roşu-alb-roşu dispuse pe verticală, lumina de ancoră de la pupa sunt luminile purtate de o navă:","a":["nestăpână pe manevră la ancoră.","cu capacitate de manevră redusă la ancoră.","stânjenită de pescajul ei la ancoră."],"c":1},{"n":76,"s":"nav","q":"Lumina neîntreruptă pe un arc de orizont de 360° este:","a":["lumina de catarg.","lumină cu sclipiri regulate.","lumină vizibilă pe întreg orizontul."],"c":2},{"n":77,"s":"nav","q":"Trei semne suprapuse din care semnul superior şi inferior câte o bulă, iar cel din mijloc un bicon sunt semnele purtate de o navă:","a":["nestăpână pe manevra sa.","stânjenită de pescajul ei.","cu capacitate de manevră redusă."],"c":2},{"n":78,"s":"nav","q":"Ce se înţelege prin expresia \"lumină vizibilă pe întreg orizontul\"?","a":["lumină neîntreruptă pe un arc de de orizont de 360°","lumină neîntreruptă vizibilă la prova şi în borduri.","lumină neîntreruptă vizibilă pe un arc de orizont de 180°"],"c":0},{"n":79,"s":"nav","q":"O lumină cu sclipiri regulate a cărei frecvenţă este de 120 sclipiri pe minut sau mai mult, reprezintă ceea ce se înţelege prin expresia:","a":["lumină de bord.","lumină cu sclipiri.","lumină de remorcaj."],"c":1},{"n":80,"s":"nav","q":"O bulă la prova şi trei semne dispuse vertical, dintre care semnul superior şi inferior bule şi cel din mijloc bicon, montate în locul cel mai vizibil sunt semnele purtate de o navă:","a":["cu capacitate de manevră redusă la ancoră.","stânjenită de pescajul ei la ancoră.","nestăpână pe manevră la ancoră."],"c":0},{"n":81,"s":"nav","q":"Ce se înţelege prin expresia \"lumină cu sclipiri\"?","a":["o lumină cu sclipiri regulate cu frecvenţa de 60 sclipiri pe minut.","o lumină cu sclipiri regulate cu frecvenţa de 120 sclipiri pe minut sau mai mult.","o lumină cu sclipiri regulate foarte repezi."],"c":1},{"n":82,"s":"nav","q":"La ce distanţă trebuie să se vadă luminile de la catarge pentru navele cu lungimea între 12 şi 20 m?","a":["1-2 Mm.","2 Mm.","3 Mm."],"c":2},{"n":83,"s":"nav","q":"La ce distanţă trebuie să se vadă luminile de la catarge pentru navele cu lungimea mai mică de 12 m?","a":["3 Mm.","2 Mm.","1 Mm."],"c":1},{"n":84,"s":"nav" enă cu sclipiri vizibilă pe tot orizontul."],"c":2},{"n":95,"s":"nav","q":"Ce lumini trebuie să poarte o navă cu propulsie mecanică în marş cu lungimea mai mare de 7 m şi a cărei viteză depăşeşte 7 Nd?","a":["o lumină albă vizibilă peste tot orizontul şi dacă este posibil şi luminile din borduri.","luminile din borduri.","o lumină albă care poate fi ridicată la nevoie."],"c":0},{"n":96,"s":"nav","q":"La ce distanţă trebuie să se vadă lumina albă vizibilă pe tot orizontul, a unei nave sau obiect de formă nedefinită, parţial în imersiune, care este remorcat?","a":["3 Mm.","2Mm.","1 Mm."],"c":0},{"n":97,"s":"nav","q":"Ce lumini trebuie să poarte obiectele sau navele remorcate, altele decât cele cu forma nedefinită?","a":["luminile de catarg şi lumina de pupa.","luminile din borduri şi lumina de pupa.","luminile de remorcher şi lumina de pupa."],"c":1},{"n":98,"s":"nav","q":"Ce lumini trebuie să poarte o navă împinsă înainte când formează o singură unitate?","a":["trebuie să poarte la extremitatea prova luminile din borduri.","lumina de catarg şi luminile din borduri.","lumină de catarg şi lumină de pupa."],"c":0},{"n":99,"s":"nav","q":"Ce lumini tebuie să poarte o navă remorcată la ureche?","a":["luminile de catarg şi lumina de pupa.","lumina de pupa şi luminile din borduri la extremitatea prova.","luminile de borduri la extremitatea prova."],"c":1},{"n":100,"s":"nav","q":"Luminile din borduri şi lumina din pupa sunt luminile pe care le poartă o navă:","a":["în seviciul de pilotaj şi este în marş.","cu vele când este la ancoră.","cu vele în marş."],"c":2},{"n":101,"s":"nav","q":"Ce lumini poartă o navă cu vele în marş?","a":["luminile din borduri.","luminile de catarg şi luminile din borduri.","luminile din borduri şi lumina de pupa."],"c":2},{"n":102,"s":"nav","q":"Luminile din borduri şi lumina din pupa, reunite într-un felinar este purtat de :","a":["o navă cu vele mai mică de 7 m, în marş.","o navă cu rame.","o navă cu vele la ancoră."],"c":0},{"n":103,"s":"nav","q const PER = 20;

const KEY = 'examState-v1';

const cards = [];
for (let i = 0; i < QUESTIONS.length; i += PER) cards.push(QUESTIONS.slice(i, i + PER));

let state = { cards:{}, wrong:[] };
let view = { name:'home' };
const app = document.getElementById('app');

/* ---------- stocare ----------
   Implicit: localStorage, pe fiecare dispozitiv separat.
   Dacă SYNC_URL este completat, starea se sincronizează prin acel endpoint,
   iar localStorage rămâne copie locală pentru cazul în care rețeaua cade.   */
const SYNC_URL = '';          // ex. https://examen-sync.<subdomeniu>.workers.dev
let syncOk = SYNC_URL !== '';

function band(score, total){
  const s = Math.round(score / total * 20);
  if (s >= 19) return 'g';
  if (s >= 17) return 'y';
  return 'r';
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function readLocal(){
  try { const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; }
  catch (e) { return null; }
}
function writeLocal(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

async function load(){
  const local = readLocal();
  if (local) state = local;

  if (SYNC_URL){
    try {
      const r = await fetch(SYNC_URL, { cache:'no-store' });
      if (r.ok){
        const remote = await r.json();
        // câștigă starea cu mai multe fișe rezolvate; la egalitate, cea mai recentă
        const nL = local  ? Object.keys(local.cards  || {}).length : -1;
        const nR = remote ? Object.keys(remote.cards || {}).length : -1;
        if (nR > nL) { state = remote; writeLocal(); }
        else if (nR === nL && remote && remote.ts && (!local || !local.ts || remote.ts > local.ts)) {
          state = remote; writeLocal();
        }
      }
    } catch (e) { syncOk = false; }
  }
  if (!state.cards) state.cards = {};
  if (!state.wrong) state.wrong = [];
}

async function save(){
  state.ts = Date.now();
  writeLocal();
  if (!SYNC_URL) return;
  try {
    const r = await fetch(SYNC_URL, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(state)
    });
    if (!r.ok) throw new Error(r.status);
    syncOk = true;
  } catch (e) {
    syncOk = false;
    note('Salvat local. Sincronizarea cu celălalt dispozitiv nu a reușit.');
  }
}

function note(msg){
  const n = document.createElement('div');
  n.textContent = msg;
  n.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--port);color:#fff;padding:10px 18px;border-radius:4px;font-size:.9375rem;z-index:9;max-width:90vw';
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 5000);
}

/* ---------- ecran principal ---------- */
function home(){
  const done = Object.keys(state.cards).length;
  const bars = cards.map((c, i) => {
    const r = state.cards[i+1];
    return `<i class="${r ? band(r.best, c.length) : ''}"></i>`;
  }).join('');

  const tiles = cards.map((c, i) => {
    const r = state.cards[i+1];
    const cls = r ? band(r.best, c.length) : '';
    const sc  = r ? `<div class="sc">${r.best}</div><div class="st">din ${c.length}</div>`
                  : `<div class="sc" style="color:var(--chart-dim)">—</div><div class="st">${c.length} întrebări</div>`;
    return `<button class="tile ${cls}" data-card="${i+1}">
      <div class="no">Fișa ${i+1}</div>${sc}</button>`;
  }).join('');

  app.innerHTML = `
    <div class="top">
      <h1>Examen clasa C</h1>
      <div class="sub">${QUESTIONS.length} întrebări · ${cards.length} fișe</div>
    </div>
    <div class="overall">${bars}</div>
    <p class="overall-note">${done} din ${cards.length} fișe rezolvate${state.wrong.length ? ` · ${state.wrong.length} greșeli de revăzut` : ''}${SYNC_URL ? (syncOk ? ' · sincronizat' : ' · doar pe acest dispozitiv') : ' · doar pe acest dispozitiv'}</p>
    <div class="grid">${tiles}</div>
    <div class="acts">
      <button class="btn" id="rand">20 întrebări la întâmplare</button>
      <button class="btn" id="mist" ${state.wrong.length ? '' : 'disabled'}>Revezi greșelile (${state.wrong.length})</button>
      <button class="btn ghost" id="reset">Șterge tot</button>
    </div>`;

  app.querySelectorAll('[data-card]').forEach(b =>
    b.onclick = () => start(+b.dataset.card, cards[+b.dataset.card - 1]));
  app.querySelector('#rand').onclick = () => {
    const pool = [...QUESTIONS].sort(() => Math.random() - .5).slice(0, PER);
    start(null, pool);
  };
  app.querySelector('#mist').onclick = () => {
    const set = new Set(state.wrong);
    const pool = QUESTIONS.filter(q => set.has(q.n)).slice(0, PER);
    if (pool.length) start('mistakes', pool);
  };
  app.querySelector('#reset').onclick = async () => {
    if (!confirm('Ștergi toate rezultatele salvate?')) return;
    state = { cards:{}, wrong:[] };
    await save(); home();
  };
}

/* ---------- chestionar ---------- */
function start(id, qs){
  view = { name:'quiz', id, qs, i:0, answers:new Array(qs.length).fill(null) };
  quiz();
}

function quiz(){
  const v = view, q = v.qs[v.i];
  const ticks = v.qs.map((_, i) =>
    `<i class="${i === v.i ? 'cur' : (v.answers[i] !== null ? 'done' : '')}" data-go="${i}"></i>`).join('');
  const opts = q.a.map((t, i) =>
    `<button class="opt ${v.answers[v.i] === i ? 'sel' : ''}" data-opt="${i}">
       <span class="k">${'ABC'[i]}</span><span>${esc(t)}</span></button>`).join('');
  const allDone = v.answers.every(a => a !== null);
  const last = v.i === v.qs.length - 1;

  app.innerHTML = `
    <div class="qhead">
      <button class="back" id="back">← Înapoi la fișe</button>
      <span class="pos">${v.i + 1} / ${v.qs.length}</span>
    </div>
    <div class="ticks">${ticks}</div>
    <p class="sect">${SECT[q.s]} · întrebarea ${q.n}</p>
    <p class="qtext">${esc(q.q)}</p>
    <div class="opts">${opts}</div>
    <div class="nav">
      <button class="btn" id="prev" ${v.i === 0 ? 'disabled' : ''}>Anterioara</button>
      ${last
        ? `<button class="btn primary" id="fin" ${allDone ? '' : 'disabled'}>Trimite răspunsurile</button>`
        : `<button class="btn primary" id="next">Următoarea</button>`}
    </div>
    ${last && !allDone ? `<p class="hist">Mai ai ${v.answers.filter(a => a === null).length} întrebări fără răspuns.</p>` : ''}`;

  app.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => {
    v.answers[v.i] = +b.dataset.opt;
    if (v.i < v.qs.length - 1) { v.i++; quiz(); } else quiz();
  });
  app.querySelectorAll('[data-go]').forEach(t => t.onclick = () => { v.i = +t.dataset.go; quiz(); });
  app.querySelector('#back').onclick = () => { if (confirm('Ieși fără să trimiți? Răspunsurile se pierd.')) home(); };
  const p = app.querySelector('#prev'); if (p) p.onclick = () => { v.i--; quiz(); };
  const n = app.querySelector('#next'); if (n) n.onclick = () => { v.i++; quiz(); };
  const f = app.querySelector('#fin'); if (f) f.onclick = finish;
}

/* ---------- rezultat ---------- */
async function finish(){
  const v = view;
  let score = 0;
  const wrongNow = [];
  v.qs.forEach((q, i) => { if (v.answers[i] === q.c) score++; else wrongNow.push(q.n); });

  if (typeof v.id === 'number'){
    const prev = state.cards[v.id];
    state.cards[v.id] = {
      best: prev ? Math.max(prev.best, score) : score,
      last: score, tries: (prev?.tries || 0) + 1, ts: Date.now()
    };
  }
  const set = new Set(state.wrong);
  v.qs.forEach((q, i) => { if (v.answers[i] === q.c) set.delete(q.n); else set.add(q.n); });
  state.wrong = [...set];
  await save();

  const b = band(score, v.qs.length);
  const verdict = { g:'Rezultat bun.', y:'Aproape. Revezi greșelile.', r:'Insuficient. Mai lucrează la această fișă.' }[b];

  const items = v.qs.map((q, i) => {
    const ok = v.answers[i] === q.c;
    return `<div class="item ${ok ? 'ok' : ''}">
      <p class="q">${i + 1}. ${esc(q.q)}</p>
      ${ok
        ? `<p class="line"><span class="good">${'ABC'[q.c]} — ${esc(q.a[q.c])}</span></p>`
        : `<p class="line"><span class="lab">Ai ales:</span> <span class="bad">${'ABC'[v.answers[i]]} — ${esc(q.a[v.answers[i]])}</span></p>
           <p class="line"><span class="lab">Corect:</span> <span class="good">${'ABC'[q.c]} — ${esc(q.a[q.c])}</span></p>`}
    </div>`;
  }).join('');

  const title = typeof v.id === 'number' ? `Fișa ${v.id}` : (v.id === 'mistakes' ? 'Greșelile tale' : '20 la întâmplare');
  const rec = typeof v.id === 'number' ? state.cards[v.id] : null;

  app.innerHTML = `
    <div class="top"><h1>${title}</h1><div class="sub">rezultat</div></div>
    <div class="score ${b}">
      <div class="big">${score}</div>
      <div class="of">din ${v.qs.length}</div>
    </div>
    <p class="verdict">${verdict}</p>
    ${rec ? `<p class="hist" style="text-align:center">Cel mai bun: ${rec.best} · încercarea ${rec.tries}</p>` : ''}
    <div class="acts" style="justify-content:center">
      <button class="btn" id="again">Încearcă din nou</button>
      <button class="btn primary" id="home">Înapoi la fișe</button>
    </div>
    <div class="rev">
      <h2>${wrongNow.length ? `${wrongNow.length} greșeli` : 'Toate corecte'}</h2>
      ${items}
    </div>`;

  app.querySelector('#home').onclick = home;
  app.querySelector('#again').onclick = () => start(v.id, v.qs);
  window.scrollTo(0, 0);
}

load().then(home);
</script>
</body>
</html>
