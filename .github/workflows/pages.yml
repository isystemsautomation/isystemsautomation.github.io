name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  guard:
    # refuse to publish if the injected loader ever reappears in a commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for known injection markers
        run: |
          set -e
          if grep -rIl -e 'hornbeamcairn' \
                       -e 'eth_call' \
                       -e 'data:text/javascript;base64' \
                       --include='*.html' --include='*.js' --include='*.css' . ; then
            echo "::error::Known malware marker found - deployment blocked."
            exit 1
          fi
          echo "No markers found."

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
