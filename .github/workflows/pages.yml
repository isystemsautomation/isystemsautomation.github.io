name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Scan for known injection markers
        run: |
          set -e
          if grep -rIl -e 'hornbeamcairn' \
                       -e 'eth_call' \
                       -e 'data:text/javascript;base64' \
                       --include='*.html' --include='*.js' --include='*.css' _site/ ; then
            echo "::error::Known malware marker found - deployment blocked."
            exit 1
          fi
          echo "No markers found."

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  livecheck:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify live deployment markers
        env:
          SITE_URL: https://www.isystemsautomation.com
        run: |
          set -euo pipefail
          # path|expected substring — deployment guard only; edit when retitling guarded pages
          CHECKS=(
            "/industries/oil-and-gas.html|Oil and Gas Automation"
            "/industries/power-generation.html|Power Plant Automation Integrator"
            "/projects/advanced-controllers-cfb-boiler.html|Industrial Boiler Control"
            "/service/maintenance.html|Automation System Maintenance"
            "/service/process-optimization-advanced-process-control.html|Advanced Process Control Systems on DCS"
            "/service/safety-systems-burner-management-systems.html|Burner Management Systems to IEC 61511"
            "/references.html|<table"
            "/automatic-boiler-start.html|Automatic boiler start-up and hot standby"
            "/hydro-turbine-control.html|Hydro turbine control and protection"
            "/|Control systems written by process engineers"
          )
          MAX_ATTEMPTS=6
          RETRY_SLEEP=15
          missing=()

          check_all() {
            missing=()
            for entry in "${CHECKS[@]}"; do
              path="${entry%%|*}"
              needle="${entry#*|}"
              url="${SITE_URL}${path}"
              body="$(curl -fsSL -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$url")"
              if ! grep -qF "$needle" <<< "$body"; then
                missing+=("$url → missing: $needle")
              fi
            done
            ((${#missing[@]} == 0))
          }

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Live check attempt ${attempt}/${MAX_ATTEMPTS}"
            if check_all; then
              echo "All live deployment markers present."
              exit 0
            fi
            if (( attempt < MAX_ATTEMPTS )); then
              sleep "$RETRY_SLEEP"
            fi
          done

          echo "::error::Live site missing expected markers after ${MAX_ATTEMPTS} attempts:"
          for line in "${missing[@]}"; do
            echo "::error::$line"
          done
          exit 1
